name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      ANDROID_COMPILE_SDK: '34'
      ANDROID_BUILD_TOOLS: '34.0.0'
      ANDROID_NDK_VERSION: '26.1.10909125'
      ANDROID_CMAKE_VERSION: '3.22.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Export Android SDK env
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile GLSL shaders to SPIR-V
        shell: bash
        run: |
          SHADER_DIR=app/src/main/cpp/shaders
          OUT_DIR=app/src/main/assets/shaders
          mkdir -p "$OUT_DIR"

          if [ -d "$SHADER_DIR" ]; then
            for f in "$SHADER_DIR"/*.comp; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .comp)
              echo "Compiling $name.comp → $name.spv"
              glslangValidator -V "$f" -o "$OUT_DIR/$name.spv"
            done
          else
            echo "Shader directory not found: $SHADER_DIR"
            exit 1
          fi

          ls -la "$OUT_DIR"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: framegen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            echo "- **Status:** ✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **APK:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ⚠️ Build completed (check logs)" >> $GITHUB_STEP_SUMMARY
          fi
